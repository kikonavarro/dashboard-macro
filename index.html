<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Risk Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f0f; color: #e8e8e8; padding: 1.5rem; min-height: 100vh; }
  h2 { font-weight: 500; font-size: 17px; color: #f0f0f0; }
  .mc { background: #1a1a1a; border: 0.5px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem 1.25rem; }
  .zb { display: flex; height: 5px; overflow: hidden; gap: 2px; margin: 10px 0 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; transition: background 0.3s; }
  .sig { display: flex; align-items: center; gap: 6px; }
  .spin { display: inline-block; width: 11px; height: 11px; border: 1.5px solid rgba(255,255,255,0.15); border-top-color: #888; border-radius: 50%; animation: sp 0.8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .badge-live { font-size: 9px; font-family: monospace; background: rgba(99,153,34,0.2); color: #8bc34a; padding: 2px 6px; border-radius: 4px; font-weight: 500; }
  .trend-up { color: #D85A30; }
  .trend-dn { color: #639922; }
  .trend-eq { color: #666; }
  #copy-toast { position: absolute; top: 0; right: 0; font-size: 11px; padding: 4px 10px; background: rgba(99,153,34,0.2); color: #8bc34a; border-radius: 8px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  input[type=range] { width: 100%; accent-color: #555; cursor: pointer; margin-top: 8px; display: block; }
  input[type=text], input[type=password] { background: #111; border: 0.5px solid rgba(255,255,255,0.15); border-radius: 8px; color: #e8e8e8; font-size: 12px; font-family: monospace; padding: 7px 12px; width: 100%; outline: none; }
  input[type=text]:focus, input[type=password]:focus { border-color: rgba(255,255,255,0.35); }
  button { cursor: pointer; }

  /* API key banner */
  #apikey-banner { background: #161616; border: 0.5px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 14px; }
  #apikey-banner p { font-size: 11px; color: #888; margin: 0 0 8px; font-family: monospace; }
  #apikey-row { display: flex; gap: 8px; align-items: center; }
  #apikey-row input { flex: 1; }
  #apikey-save { font-size: 11px; padding: 7px 14px; border-radius: 8px; background: transparent; border: 0.5px solid rgba(255,255,255,0.2); color: #e8e8e8; white-space: nowrap; }
  #apikey-save:hover { background: rgba(255,255,255,0.05); }
  #apikey-status { font-size: 10px; font-family: monospace; margin-top: 6px; }
</style>
</head>
<body>
<div style="max-width:960px;margin:0 auto;padding:0.5rem 0">

  <!-- API Key banner -->
  <div id="apikey-banner">
    <p>ANTHROPIC API KEY · necesaria para obtener datos de mercado en tiempo real · se guarda solo en tu navegador</p>
    <div id="apikey-row">
      <input type="password" id="apikey-input" placeholder="sk-ant-..." autocomplete="off" oninput="onKeyInput()">
      <button id="apikey-save" onclick="saveKey()">Guardar key</button>
      <button id="apikey-clear" onclick="clearKey()" style="font-size:11px;padding:7px 10px;border-radius:8px;background:transparent;border:0.5px solid rgba(255,255,255,0.2);color:#888">✕</button>
    </div>
    <p id="apikey-status"></p>
    <p style="margin-top:6px;color:#555">Obtén tu API key gratis en <a href="https://console.anthropic.com" target="_blank" style="color:#8bc34a;text-decoration:none">console.anthropic.com</a> · cada actualización cuesta ~$0.01</p>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.25rem;padding-bottom:0.75rem;border-bottom:0.5px solid rgba(255,255,255,0.1);flex-wrap:wrap;gap:10px">
    <div>
      <p style="font-size:10px;color:#888;font-family:monospace;text-transform:uppercase;letter-spacing:0.07em;margin:0 0 3px">Macro risk monitor · global</p>
      <h2 style="margin:0 0 6px">Dashboard de riesgo de recesión</h2>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="alert-count" style="font-size:11px;font-family:monospace;color:#888">— / 10 señales</span>
        <span id="ts" style="font-size:11px;color:#888;font-family:monospace"></span>
      </div>
    </div>
    <div style="display:flex;gap:6px;align-items:center;position:relative">
      <span id="copy-toast">copiado</span>
      <button onclick="copyReport()" style="font-size:11px;padding:5px 12px;border-radius:8px;background:transparent;border:0.5px solid rgba(255,255,255,0.2);color:#e8e8e8">⎘ Copiar resumen</button>
      <button id="rbtn" onclick="fetchData()" style="font-size:11px;padding:5px 12px;border-radius:8px;background:transparent;border:0.5px solid rgba(255,255,255,0.2);color:#e8e8e8;display:flex;align-items:center;gap:6px">
        <span id="rbtn-icon">↻</span> Actualizar
      </button>
      <button id="export-btn" onclick="exportData()" style="display:none;font-size:11px;padding:5px 12px;border-radius:8px;background:rgba(99,153,34,0.15);border:0.5px solid rgba(99,153,34,0.4);color:#8bc34a;display:none;align-items:center;gap:4px">↓ Guardar data.json</button>
    </div>
  </div>

  <div id="status-bar" style="display:none;align-items:center;gap:8px;padding:10px 14px;margin-bottom:10px;background:#222;border-radius:8px;border:0.5px solid rgba(255,255,255,0.1)">
    <span class="spin"></span>
    <span id="status-txt" style="font-size:12px;color:#888">Buscando datos...</span>
  </div>
  <div id="error-bar" style="display:none;padding:10px 14px;margin-bottom:10px;background:rgba(163,45,45,0.15);border-radius:8px;border:0.5px solid rgba(163,45,45,0.4)">
    <span style="font-size:12px;color:#e57373" id="error-txt"></span>
  </div>

  <div id="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:10px;margin-bottom:10px"></div>
  <div id="verdict" class="mc" style="margin-bottom:6px"></div>
  <div id="data-source" style="display:none;font-size:10px;color:#666;font-family:monospace;margin-top:6px"></div>

</div>

<script>
const ZC=['#639922','#BA7517','#D85A30','#A32D2D'];
const TC=['#8bc34a','#f5a623','#D85A30','#e57373'];
const LS_KEY='macro_dash_apikey';

let apiKey='';
let liveData=false;
let trends={};
let viewerMode=false;
let lastParsedData=null;

function loadKey(){
  const k=localStorage.getItem(LS_KEY)||'';
  apiKey=k;
  if(k){
    document.getElementById('apikey-input').value=k;
    setKeyStatus('key guardada · datos live activados','#8bc34a');
  }
}

function onKeyInput(){
  const v=document.getElementById('apikey-input').value.trim();
  if(!v)setKeyStatus('','');
}

function saveKey(){
  const v=document.getElementById('apikey-input').value.trim();
  if(!v){setKeyStatus('introduce una API key válida','#e57373');return;}
  if(!v.startsWith('sk-ant-')){setKeyStatus('la key debe empezar por sk-ant-','#e57373');return;}
  apiKey=v;
  localStorage.setItem(LS_KEY,v);
  setKeyStatus('key guardada · datos live activados','#8bc34a');
  fetchData();
}

function clearKey(){
  apiKey='';
  localStorage.removeItem(LS_KEY);
  document.getElementById('apikey-input').value='';
  setKeyStatus('key eliminada','#888');
}

function setKeyStatus(msg,col){
  const el=document.getElementById('apikey-status');
  el.textContent=msg;
  el.style.color=col;
}

const INDS=[
  {id:'oil',name:'Petróleo Brent',cat:'Shock energético',pre:'$',suf:'',min:50,max:160,val:88,th:[90,110,130],step:1,inv:false,
   labs:['normal','presión inflacionaria','riesgo desacel.','recesión inminente'],key:'brent'},
  {id:'vix',name:'VIX',cat:'Volatilidad de renta variable',pre:'',suf:'',min:10,max:60,val:17,th:[18,25,35],step:0.5,inv:false,
   labs:['mercado tranquilo','tensión','estrés financiero','pánico'],key:'vix'},
  {id:'move',name:'MOVE Index',cat:'Volatilidad de bonos',pre:'',suf:'',min:50,max:250,val:110,th:[100,150,200],step:1,inv:false,
   labs:['bonos estables','tensión en tipos','estrés severo','pánico de tipos'],key:'move'},
  {id:'crv',name:'Curva tipos 10Y – 2Y',cat:'Tipos de interés (US)',pre:'',suf:'%',min:-1.5,max:0.8,val:-0.2,th:[0,-0.5],step:0.05,inv:true,
   labs:['expansión','alerta de inversión','recesión probable'],key:'yield_curve'},
  {id:'inf',name:'Inflación 5y5y',cat:'Expectativas inflación',pre:'',suf:'%',min:1.5,max:3.5,val:2.45,th:[2.3,2.7],step:0.05,inv:false,
   labs:['estable','presión inflacionaria','riesgo estanflación'],key:'inflation_5y5y'},
  {id:'bdt',name:'Baltic Dirty Tanker',cat:'Comercio de petróleo',pre:'',suf:'%',min:-5,max:80,val:10,th:[20,50],step:1,inv:false,
   labs:['comercio fluido','tensión en rutas','disrupción seria'],key:'tanker_chg'},
  {id:'hy',name:'HY Credit Spreads',cat:'Crédito / estrés financiero',pre:'',suf:' bps',min:200,max:700,val:340,th:[350,500],step:5,inv:false,
   labs:['normal','tensión crediticia','riesgo de crisis'],key:'hy_spreads'},
  {id:'xccy',name:'EUR/USD Cross-Currency Basis',cat:'Estrés de liquidez en dólares',pre:'',suf:' bps',min:-120,max:20,val:-12,th:[-10,-25,-50],step:1,inv:true,
   labs:['liquidez normal','tensión en dólares','estrés severo','crisis de liquidez'],key:'xccy_basis'}
];

const QUALS={
  fci:{id:'fci',name:'Financial Conditions Index',cat:'Condiciones de financiación',opts:['laxo','neutro','restrictivo'],labs:['favorable al crecimiento','condiciones estables','riesgo de recesión'],val:1,key:'fci'},
  liq:{id:'liq',name:'Liquidez global',cat:'Fed · ECB · PBOC · BOJ',opts:['creciendo','estable','cayendo'],labs:['expansiva','neutral','contractiva'],val:1,key:'global_liquidity'}
};

function getSig(ind){
  if(ind.inv){for(let i=0;i<ind.th.length;i++)if(ind.val>=ind.th[i])return i;return ind.th.length;}
  else{for(let i=0;i<ind.th.length;i++)if(ind.val<ind.th[i])return i;return ind.th.length;}
}
function fmt(ind){
  const v=ind.val,n=ind.step<0.1?v.toFixed(2):ind.step<1?v.toFixed(1):Math.round(v);
  return `${ind.pre}${n}${ind.suf}`;
}
function barSegs(n,sig){
  let h='';
  for(let i=0;i<n;i++)h+=`<div style="flex:1;border-radius:2px;background:${i===sig?ZC[Math.min(i,3)]:'rgba(255,255,255,0.1)'};transition:background 0.3s"></div>`;
  return h;
}
function trendArrow(id,inv){
  const t=trends[id];if(!t)return '';
  let cls,sym;
  if(t==='up'){cls=inv?'trend-dn':'trend-up';sym='↑';}
  else if(t==='down'){cls=inv?'trend-up':'trend-dn';sym='↓';}
  else{cls='trend-eq';sym='→';}
  return `<span class="${cls}" style="font-size:13px;margin-left:4px">${sym}</span>`;
}
function cardHTML(ind){
  const s=getSig(ind),col=TC[Math.min(s,3)],lab=ind.labs[Math.min(s,ind.labs.length-1)];
  const badge=liveData?`<span class="badge-live">LIVE</span>`:'';
  const arr=trendArrow(ind.id,ind.inv);
  const slider=viewerMode?'':`<input type="range" min="${ind.min}" max="${ind.max}" step="${ind.step}" value="${ind.val}" oninput="upd('${ind.id}',parseFloat(this.value))" id="sl-${ind.id}">`;
  return `<div class="mc" id="c-${ind.id}">
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
  <div><div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">${badge}<p style="font-size:10px;color:#888;font-family:monospace;text-transform:uppercase;letter-spacing:0.07em;margin:0">${ind.cat}</p></div>
  <p style="font-size:13px;font-weight:500;margin:0;color:#e8e8e8">${ind.name}</p></div>
  <div style="display:flex;align-items:baseline;gap:2px">
    <span id="v-${ind.id}" style="font-family:monospace;font-size:19px;font-weight:500;color:${col};white-space:nowrap">${fmt(ind)}</span>${arr}
  </div>
</div>
<div class="zb" id="bar-${ind.id}">${barSegs(ind.th.length+1,s)}</div>
<div class="sig">
  <span class="dot" id="d-${ind.id}" style="background:${col}"></span>
  <span id="l-${ind.id}" style="font-size:12px;font-weight:500;color:${col}">${lab}</span>
</div>
${slider}
</div>`;
}
function qualHTML(q){
  const s=q.val,col=TC[Math.min(s,3)];
  const badge=liveData?`<span class="badge-live">LIVE</span>`:'';
  const arr=trendArrow(q.id,false);
  const btns=viewerMode?'':`<div style="display:flex;gap:6px">${q.opts.map((o,i)=>`<button onclick="updq('${q.id}',${i})" style="flex:1;font-size:11px;padding:5px 2px;border-radius:8px;background:${i===s?'rgba(255,255,255,0.08)':'transparent'};border:0.5px solid rgba(255,255,255,0.2);color:#e8e8e8">${o}</button>`).join('')}</div>`;
  return `<div class="mc" id="c-${q.id}">
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
  <div><div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">${badge}<p style="font-size:10px;color:#888;font-family:monospace;text-transform:uppercase;letter-spacing:0.07em;margin:0">${q.cat}</p></div>
  <p style="font-size:13px;font-weight:500;margin:0;color:#e8e8e8">${q.name}</p></div>
  <div style="display:flex;align-items:center;gap:2px">
    <span id="v-${q.id}" style="font-size:13px;font-weight:500;color:${col}">${q.opts[s]}</span>${arr}
  </div>
</div>
<div class="zb" id="bar-${q.id}">${barSegs(q.opts.length,s)}</div>
<div class="sig"${viewerMode?'':' style="margin-bottom:10px"'}>
  <span class="dot" id="d-${q.id}" style="background:${col}"></span>
  <span id="l-${q.id}" style="font-size:12px;font-weight:500;color:${col}">${q.labs[s]}</span>
</div>
${btns}
</div>`;
}
function updateAlertCount(){
  let alerts=0;
  INDS.forEach(ind=>{if(getSig(ind)>=1)alerts++;});
  if(QUALS.fci.val>=1)alerts++;if(QUALS.liq.val>=1)alerts++;
  const tot=INDS.length+2;
  const col=alerts===0?TC[0]:alerts<=3?TC[1]:TC[3];
  document.getElementById('alert-count').innerHTML=`<span style="color:${col};font-weight:500">${alerts}</span> / ${tot} señales en alerta`;
}
function totalRisk(){
  let tot=0,cnt=0;
  INDS.forEach(ind=>{tot+=getSig(ind);cnt++;});
  tot+=QUALS.fci.val+QUALS.liq.val;cnt+=2;
  const avg=tot/cnt;
  if(avg<0.35)return[0,'Riesgo bajo','Condiciones de expansión. Todos los indicadores en zona verde.'];
  if(avg<0.9)return[1,'Riesgo moderado','Algunas señales de alerta. Monitorizar de cerca.'];
  if(avg<1.7)return[2,'Riesgo elevado','Múltiples señales de tensión. Posición defensiva recomendada.'];
  return[3,'Riesgo de recesión','Señales sistémicas en rojo. Posicionamiento muy defensivo.'];
}
function renderVerdict(){
  const[lv,label,detail]=totalRisk(),col=TC[lv];
  const v=document.getElementById('verdict');
  v.style.borderLeft=`3px solid ${col}`;
  v.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:10px;height:10px;border-radius:50%;background:${col};flex-shrink:0"></div>
      <div>
        <p style="font-size:10px;color:#888;font-family:monospace;text-transform:uppercase;letter-spacing:0.07em;margin:0 0 2px">evaluación global · ${INDS.length+2} indicadores</p>
        <p style="font-size:15px;font-weight:500;color:${col};margin:0">${label}</p>
      </div>
    </div>
    <p style="font-size:13px;color:#888;margin:0;max-width:360px">${detail}</p>
  </div>`;
  updateAlertCount();
}
function upd(id,v){
  const ind=INDS.find(i=>i.id===id);ind.val=v;
  const s=getSig(ind),col=TC[Math.min(s,3)],lab=ind.labs[Math.min(s,ind.labs.length-1)];
  document.getElementById('v-'+id).textContent=fmt(ind);
  document.getElementById('v-'+id).style.color=col;
  document.getElementById('l-'+id).textContent=lab;
  document.getElementById('l-'+id).style.color=col;
  document.getElementById('d-'+id).style.background=col;
  document.getElementById('bar-'+id).innerHTML=barSegs(ind.th.length+1,s);
  renderVerdict();
}
function updq(id,val){
  QUALS[id].val=val;
  const el=document.getElementById('c-'+id);
  const tmp=document.createElement('div');
  tmp.innerHTML=qualHTML(QUALS[id]);
  el.replaceWith(tmp.firstElementChild);
  renderVerdict();
}
function renderGrid(){
  const grid=document.getElementById('grid');grid.innerHTML='';
  INDS.forEach(ind=>{grid.innerHTML+=cardHTML(ind);});
  grid.innerHTML+=qualHTML(QUALS.fci);
  grid.innerHTML+=qualHTML(QUALS.liq);
  renderVerdict();
}
function setStatus(show,txt){
  const b=document.getElementById('status-bar');b.style.display=show?'flex':'none';
  if(txt)document.getElementById('status-txt').textContent=txt;
}
function setError(msg){
  const b=document.getElementById('error-bar');b.style.display=msg?'block':'none';
  if(msg)document.getElementById('error-txt').textContent=msg;
}
function setRefreshBtn(loading){
  const btn=document.getElementById('rbtn');
  document.getElementById('rbtn-icon').innerHTML=loading?'<span class="spin" style="width:10px;height:10px;border-width:1.5px;vertical-align:middle"></span>':'↻';
  btn.disabled=loading;btn.style.opacity=loading?'0.5':'1';
}
function copyReport(){
  const[lv,label]=totalRisk();
  const now=new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
  let lines=[`📊 Macro Dashboard — ${now}`,`Evaluación: ${label}`,``];
  INDS.forEach(ind=>{
    const s=getSig(ind),lab=ind.labs[Math.min(s,ind.labs.length-1)];
    const icon=s===0?'🟢':s===1?'🟡':s===2?'🟠':'🔴';
    lines.push(`${icon} ${ind.name}: ${fmt(ind)} — ${lab}`);
  });
  ['fci','liq'].forEach(k=>{
    const q=QUALS[k];
    const icon=q.val===0?'🟢':q.val===1?'🟡':'🔴';
    lines.push(`${icon} ${q.name}: ${q.opts[q.val]} — ${q.labs[q.val]}`);
  });
  navigator.clipboard.writeText(lines.join('\n')).then(()=>{
    const t=document.getElementById('copy-toast');
    t.style.opacity='1';setTimeout(()=>t.style.opacity='0',1800);
  });
}
async function fetchData(){
  if(!apiKey){setError('Introduce tu API key de Anthropic arriba para cargar datos en tiempo real.');return;}
  setRefreshBtn(true);setStatus(true,'Buscando datos de mercado...');setError('');
  const today=new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'});
  const prompt=`Today is ${today}. Search the web for the latest values of these financial market indicators. Return ONLY a valid JSON object (no markdown, no explanation, no code blocks):
{"brent":<number>,"vix":<number>,"move":<number>,"yield_curve":<number>,"inflation_5y5y":<number>,"hy_spreads":<number>,"tanker_chg":<number>,"xccy_basis":<number>,"fci":<0,1,2>,"global_liquidity":<0,1,2>,"trends":{"brent":"up|down|flat","vix":"up|down|flat","move":"up|down|flat","yield_curve":"up|down|flat","hy_spreads":"up|down|flat","xccy_basis":"up|down|flat"},"timestamp":"<date>","sources":"<sources>"}`;
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1200,tools:[{type:'web_search_20250305',name:'web_search'}],messages:[{role:'user',content:prompt}]})
    });
    if(!resp.ok){
      const err=await resp.json().catch(()=>({}));
      throw new Error(err.error?.message||`HTTP ${resp.status}`);
    }
    const data=await resp.json();
    let raw='';
    for(const b of data.content){if(b.type==='text')raw+=b.text;}
    const clean=raw.replace(/```json|```/g,'').trim();
    let parsed;
    try{parsed=JSON.parse(clean);}
    catch(e){const m=clean.match(/\{[\s\S]*\}/);if(m)parsed=JSON.parse(m[0]);else throw new Error('JSON inválido');}
    if(parsed.trends)trends=parsed.trends;
    INDS.forEach(ind=>{
      if(parsed[ind.key]!==undefined){
        const v=Math.max(ind.min,Math.min(ind.max,parseFloat(parsed[ind.key])));
        if(!isNaN(v))ind.val=v;
      }
    });
    if(parsed.fci!==undefined){const v=parseInt(parsed.fci);QUALS.fci.val=isNaN(v)?1:Math.max(0,Math.min(2,v));}
    if(parsed.global_liquidity!==undefined){const v=parseInt(parsed.global_liquidity);QUALS.liq.val=isNaN(v)?1:Math.max(0,Math.min(2,v));}
    lastParsedData=parsed;
    liveData=true;renderGrid();
    document.getElementById('export-btn').style.display='flex';
    const srcEl=document.getElementById('data-source');
    srcEl.style.display='block';
    srcEl.textContent=`datos: ${parsed.timestamp||today} · fuentes: ${parsed.sources||'web search'}`;
    document.getElementById('ts').textContent=`· ${new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}`;
    setStatus(false);
  }catch(err){
    setStatus(false);
    setError(`Error: ${err.message}`);
  }finally{setRefreshBtn(false);}
}

function exportData(){
  const data={};
  INDS.forEach(ind=>{data[ind.key]=ind.val;});
  data.fci=QUALS.fci.val;
  data.global_liquidity=QUALS.liq.val;
  data.trends=trends;
  data.timestamp=new Date().toISOString();
  data.sources=lastParsedData?.sources||'web search';
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='data.json';a.click();URL.revokeObjectURL(a.href);
  const t=document.getElementById('copy-toast');
  t.textContent='data.json descargado';t.style.opacity='1';
  setTimeout(()=>{t.style.opacity='0';t.textContent='copiado';},2000);
}

async function loadDataJson(){
  try{
    const resp=await fetch('data.json');
    if(!resp.ok)return false;
    const data=await resp.json();
    if(data.trends)trends=data.trends;
    INDS.forEach(ind=>{
      if(data[ind.key]!==undefined){
        const v=Math.max(ind.min,Math.min(ind.max,parseFloat(data[ind.key])));
        if(!isNaN(v))ind.val=v;
      }
    });
    if(data.fci!==undefined)QUALS.fci.val=Math.max(0,Math.min(2,parseInt(data.fci)||0));
    if(data.global_liquidity!==undefined)QUALS.liq.val=Math.max(0,Math.min(2,parseInt(data.global_liquidity)||0));
    liveData=true;
    const srcEl=document.getElementById('data-source');
    srcEl.style.display='block';
    const ts=data.timestamp?new Date(data.timestamp).toLocaleString('es-ES',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
    srcEl.textContent=`última actualización: ${ts} · fuentes: ${data.sources||'data.json'}`;
    return true;
  }catch(e){return false;}
}

loadKey();
(async()=>{
  const hasJson=await loadDataJson();
  if(!apiKey&&hasJson){
    viewerMode=true;
    document.getElementById('apikey-banner').style.display='none';
    document.getElementById('rbtn').style.display='none';
  }
  renderGrid();
  document.getElementById('ts').textContent=new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
  if(apiKey)fetchData();
})();
</script>
